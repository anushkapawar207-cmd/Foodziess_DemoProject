<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Foodiziess</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">Foodiziess Admin</div>

        <div class="nav-buttons">

            <button id="admin-logout">
                Logout
            </button>

        </div>

    </nav>


    <!-- Dashboard -->
    <section class="section">

        <h1>Admin Dashboard</h1>

        <p>Manage your Foodiziess website.</p>


        <!-- Dashboard Cards -->
        <div class="category-grid">

            <div class="category-card">

                <h2>🍴</h2>

                <h3>Manage Recipes</h3>

                <p>Add, edit and delete recipes.</p>

                <button id="manage-recipes">
                    Manage Recipes
                </button>

            </div>


            <div class="category-card">

                <h2>👥</h2>

                <h3>View Users</h3>

                <p>View registered Foodiziess users.</p>

                <button id="view-users">
                    View Users
                </button>

            </div>

        </div>

    </section>


    <script src="../js/auth.js"></script>

</body>

</html>
