<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Foodiziess</title>

    <link rel="stylesheet" href="../css/style.css">


    <style>

        /* =========================
           ADMIN LOGIN PAGE
        ========================== */

        .admin-auth-page {

            min-height: calc(100vh - 80px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;

            background:
                radial-gradient(
                    circle at top right,
                    #ead8f3,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom left,
                    #f5ddeb,
                    transparent 40%
                ),
                #faf7fc;
        }


        .admin-card {

            width: 100%;

            max-width: 470px;

            background: white;

            padding: 50px;

            border-radius: 28px;

            box-shadow:
                0 20px 60px rgba(70, 30, 90, 0.15);

            text-align: center;

            border-top: 5px solid #7b3f98;
        }


        .admin-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #7b3f98,
                    #c26bc2
                );

            font-size: 34px;

            box-shadow:
                0 10px 25px rgba(123, 63, 152, 0.2);
        }


        .admin-card h1 {

            color: #4b245f;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .admin-card > p {

            color: #777;

            margin-bottom: 30px;
        }


        .admin-form {

            text-align: left;
        }


        .admin-form .form-group {

            margin-bottom: 20px;
        }


        .admin-form label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #4c3455;
        }


        .admin-form input {

            width: 100%;

            box-sizing: border-box;

            padding: 14px 16px;

            border-radius: 13px;

            border: 1px solid #e1d6e7;

            background: #fcf9fd;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }


        .admin-form input:focus {

            border-color: #9a52ad;

            background: white;

            box-shadow:
                0 0 0 4px rgba(154, 82, 173, 0.1);
        }


        .admin-login-button {

            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #65317f,
                    #9d4eaa
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 8px 20px rgba(101, 49, 127, 0.22);
        }


        .admin-login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(101, 49, 127, 0.3);
        }


        #admin-login-message {

            text-align: center;

            margin-top: 15px;
        }


        .admin-back {

            display: inline-block;

            margin-top: 25px;

            color: #8b479e;

            text-decoration: none;

            font-weight: 600;
        }


        .admin-back:hover {

            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .admin-card {

                padding: 40px 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            Foodiziess
        </div>


        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

        </div>

    </nav>



    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <section class="admin-auth-page">

        <div class="admin-card">


            <div class="admin-icon">
                👑
            </div>


            <h1>
                Admin Portal
            </h1>


            <p>
                Login to manage your Foodiziess recipes.
            </p>



            <form
                id="admin-login-form"
                class="admin-form"
            >


                <div class="form-group">

                    <label for="admin-email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter admin email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Login to Admin Panel 🔐
                </button>


                <p id="admin-login-message"></p>

            </form>



            <a
                href="../index.html"
                class="admin-back"
            >
                ← Back to Foodiziess
            </a>

        </div>

    </section>



    <script src="../js/auth.js"></script>

</body>

</html>
