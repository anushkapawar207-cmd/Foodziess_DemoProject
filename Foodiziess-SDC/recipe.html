    <!-- ===============================
         RECIPE DETAILS
    ================================ -->

    <main class="recipe-detail-container">

        <div id="recipe-detail">

            <!-- JavaScript will insert the recipe here -->

        </div>

    </main>


    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script src="js/auth.js"></script>

    <script>

        // Get recipe ID from URL
        const urlParams =
            new URLSearchParams(window.location.search);

        const recipeId =
            Number(urlParams.get("id"));


        // Get recipes from Local Storage
        const recipes =
            JSON.parse(localStorage.getItem("recipes")) || [];


        // Find selected recipe
        const recipe =
            recipes.find(function(recipe) {

                return recipe.id === recipeId;

            });


        const recipeDetail =
            document.getElementById("recipe-detail");


        // If recipe doesn't exist
        if (!recipe) {

            recipeDetail.innerHTML = `

                <div class="recipe-not-found">

                    <h2>Recipe not found 😭</h2>

                    <p>
                        Sorry, we couldn't find this recipe.
                    </p>

                    <a href="index.html">
                        ← Back to Home
                    </a>

                </div>

            `;

        }

        else {

            // ===============================
            // INGREDIENTS
            // ===============================

            let ingredientsHTML = "";

            if (recipe.ingredients) {

                const ingredients =
                    recipe.ingredients
                        .split(/\r?\n|,/)
                        .map(item => item.trim())
                        .filter(item => item !== "");

                ingredientsHTML = ingredients
                    .map(function(ingredient) {

                        return `
                            <li>${ingredient}</li>
                        `;

                    })
                    .join("");

            }

            if (!ingredientsHTML) {

                ingredientsHTML = `
                    <li>
                        Ingredients have not been added yet.
                    </li>
                `;

            }


            // ===============================
            // INSTRUCTIONS
            // ===============================

            let instructionsHTML = "";

            if (recipe.instructions) {

                const instructions =
                    recipe.instructions
                        .split(/\r?\n/)
                        .map(item => item.trim())
                        .filter(item => item !== "");

                instructionsHTML = instructions
                    .map(function(step) {

                        return `
                            <li>${step}</li>
                        `;

                    })
                    .join("");

            }

            if (!instructionsHTML) {

                instructionsHTML = `
                    <li>
                        Instructions have not been added yet.
                    </li>
                `;

            }


            // ===============================
            // DISPLAY RECIPE
            // ===============================

            recipeDetail.innerHTML = `

                <div class="recipe-detail-card">

                    <div class="recipe-detail-image">

                        <img
                            src="${recipe.image}"
                            alt="${recipe.name}"
                        >

                    </div>


                    <div class="recipe-detail-content">

                        <h1>
                            ${recipe.name}
                        </h1>


                        <div class="recipe-meta">

                            <span>
                                ${recipe.meal}
                            </span>

                            <span>
                                ${recipe.taste}
                            </span>

                            <span>
                                ${recipe.cuisine}
                            </span>

                            <span>
                                ${recipe.diet}
                            </span>

                        </div>


                        <section class="recipe-section">

                            <h2>
                                🥘 Ingredients
                            </h2>

                            <ul class="ingredients-list">

                                ${ingredientsHTML}

                            </ul>

                        </section>


                        <section class="recipe-section">

                            <h2>
                                👩‍🍳 Instructions
                            </h2>

                            <ol class="instructions-list">

                                ${instructionsHTML}

                            </ol>

                        </section>


                        <a
                            href="index.html"
                            class="back-button"
                        >
                            ← Back to Recipes
                        </a>

                    </div>

                </div>

            `;

        }

    </script>
